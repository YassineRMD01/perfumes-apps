<button type="button" class="toggle" (click)="theme.toggle()" role="switch" [attr.aria-checked]="theme.isDark()"
        [attr.aria-label]="(theme.isDark() ? 'pref.switchToLight' : 'pref.switchToDark') | t"
        [title]="(theme.isDark() ? 'pref.switchToLight' : 'pref.switchToDark') | t">
  <fa-icon [icon]="theme.isDark() ? i.sun : i.moon" />
</button>
