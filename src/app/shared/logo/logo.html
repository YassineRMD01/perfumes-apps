<span class="logo" [class]="'logo--' + size()" dir="ltr">
  @if (settings.logo(); as src) {
    <img [src]="src" alt="" class="logo__mark rounded-xl object-cover" />
  } @else {
    <svg class="logo__mark" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient [attr.id]="gid" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" style="stop-color: var(--color-brand-300)" />
          <stop offset="1" style="stop-color: var(--color-brand-600)" />
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="44" height="44" rx="14" [attr.fill]="'url(#' + gid + ')'" />
      <rect x="20" y="8.5" width="8" height="5.5" rx="1.6" fill="#fff" />
      <path d="M15.5 23.5c0-4.6 3.8-8.2 8.5-8.2s8.5 3.6 8.5 8.2V34a5.5 5.5 0 0 1-5.5 5.5h-6A5.5 5.5 0 0 1 15.5 34z" fill="#fff" />
      <path d="M24 23.2c2.2 2.8 3.5 4.8 3.5 6.6a3.5 3.5 0 0 1-7 0c0-1.8 1.3-3.8 3.5-6.6z" [attr.fill]="'url(#' + gid + ')'" />
    </svg>
  }
  @if (withText()) {
    <span class="logo__text">
      <span class="logo__name">{{ settings.storeName() }}</span>
      @if (withTagline()) {
        <span class="logo__tagline">{{ 'brand.tagline' | t }}</span>
      }
    </span>
  }
</span>
