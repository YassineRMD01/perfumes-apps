@if (src(); as s) {
  <img [src]="s" [alt]="name()" class="photo" [class.photo--cover]="fit() === 'cover'" loading="lazy" />
} @else {
  <svg viewBox="0 0 120 160" class="bottle" role="img" [attr.aria-label]="name()" direction="ltr">
    <defs>
      <linearGradient [attr.id]="gid" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" [attr.stop-color]="color()" stop-opacity="1" />
        <stop offset="100%" [attr.stop-color]="color()" stop-opacity="0.55" />
      </linearGradient>
      <!-- brushed gold for caps and collars -->
      <linearGradient [attr.id]="gid + 'g'" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#b8924a" />
        <stop offset="45%" stop-color="#f1dfae" />
        <stop offset="100%" stop-color="#a5803c" />
      </linearGradient>
      <linearGradient [attr.id]="gid + 'k'" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#151413" />
        <stop offset="50%" stop-color="#3a3835" />
        <stop offset="100%" stop-color="#121110" />
      </linearGradient>
    </defs>
    @let fill = 'url(#' + gid + ')';
    @let gold = 'url(#' + gid + 'g)';
    @let black = 'url(#' + gid + 'k)';
    @switch (packaging()) {
      @case ('jar') {
        <rect x="18" y="40" width="84" height="26" rx="8" [attr.fill]="gold" />
        <rect x="22" y="64" width="76" height="6" fill="#00000022" />
        <rect x="14" y="66" width="92" height="78" rx="20" [attr.fill]="fill" stroke="rgba(255,255,255,.8)" stroke-width="2" />
        <rect x="22" y="74" width="8" height="58" rx="4" fill="#fff" opacity=".3" />
        <rect x="32" y="90" width="56" height="30" rx="4" fill="#fff" opacity=".92" />
        <text x="60" y="104" text-anchor="middle" font-size="8.5" font-family="Cormorant Garamond, serif" font-weight="600" fill="#141311">{{ label() }}</text>
        <text x="60" y="114" text-anchor="middle" font-size="4.6" letter-spacing="1.2" font-family="Jost, sans-serif" fill="#69645c">{{ sub() }}</text>
      }
      @case ('tube') {
        <rect x="34" y="12" width="52" height="8" rx="2" [attr.fill]="fill" opacity=".9" />
        <path d="M30 20 H90 L82 124 H38 Z" [attr.fill]="fill" stroke="rgba(255,255,255,.8)" stroke-width="2" />
        <path d="M38 26 L42 118" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".3" />
        <rect x="40" y="60" width="40" height="34" rx="3" fill="#fff" opacity=".92" />
        <text x="60" y="75" text-anchor="middle" font-size="6.5" font-family="Cormorant Garamond, serif" font-weight="600" fill="#141311">{{ label().slice(0, 12) }}</text>
        <text x="60" y="84" text-anchor="middle" font-size="3.8" letter-spacing="1" font-family="Jost, sans-serif" fill="#69645c">{{ sub() }}</text>
        <rect x="42" y="124" width="36" height="26" rx="5" [attr.fill]="gold" />
      }
      @case ('dropper') {
        <ellipse cx="60" cy="20" rx="11" ry="13" [attr.fill]="black" />
        <rect x="46" y="30" width="28" height="20" rx="3" [attr.fill]="gold" />
        <rect x="28" y="50" width="64" height="98" rx="14" [attr.fill]="fill" stroke="rgba(255,255,255,.8)" stroke-width="2" />
        <rect x="58" y="50" width="4" height="70" fill="#ffffff55" />
        <rect x="35" y="58" width="7" height="80" rx="3.5" fill="#fff" opacity=".3" />
        <rect x="36" y="94" width="48" height="30" rx="3" fill="#fff" opacity=".92" />
        <text x="60" y="108" text-anchor="middle" font-size="7" font-family="Cormorant Garamond, serif" font-weight="600" fill="#141311">{{ label().slice(0, 13) }}</text>
        <text x="60" y="117" text-anchor="middle" font-size="4" letter-spacing="1" font-family="Jost, sans-serif" fill="#69645c">{{ sub() }}</text>
      }
      @case ('lipstick') {
        <path d="M47 70 V40 Q47 30 58 26 L73 20 V70 Z" [attr.fill]="color()" />
        <path d="M50 66 V42 Q50 34 56 31" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".35" />
        <rect x="43" y="68" width="34" height="22" rx="2" [attr.fill]="gold" />
        <rect x="38" y="88" width="44" height="64" rx="5" [attr.fill]="black" />
        <rect x="38" y="88" width="44" height="4" [attr.fill]="gold" />
        <rect x="43" y="96" width="5" height="50" rx="2.5" fill="#fff" opacity=".12" />
      }
      @case ('compact') {
        <circle cx="60" cy="86" r="48" [attr.fill]="gold" />
        <circle cx="60" cy="86" r="42" [attr.fill]="black" />
        <circle cx="60" cy="86" r="34" [attr.fill]="color()" />
        <circle cx="60" cy="86" r="34" fill="none" stroke="#ffffff40" stroke-width="1" />
        <path d="M38 74 Q60 56 82 74" stroke="#fff" stroke-width="3" fill="none" opacity=".25" stroke-linecap="round" />
        <text x="60" y="90" text-anchor="middle" font-size="6" letter-spacing="1.4" font-family="Jost, sans-serif" fill="#ffffffcc">{{ sub() }}</text>
      }
      @default {
        <rect x="42" y="4" width="36" height="28" rx="6" [attr.fill]="gold" />
        <rect x="50" y="32" width="20" height="12" fill="#e9e1d4" />
        <rect x="16" y="44" width="88" height="110" rx="20" [attr.fill]="fill" stroke="rgba(255,255,255,.8)" stroke-width="2" />
        <rect x="24" y="54" width="9" height="88" rx="4.5" fill="#fff" opacity=".35" />
        <rect x="32" y="86" width="56" height="34" rx="4" fill="#fff" opacity=".92" />
        <text x="60" y="101" text-anchor="middle" font-size="9" font-family="Cormorant Garamond, serif" font-weight="600" fill="#141311">{{ label() }}</text>
        <text x="60" y="112" text-anchor="middle" font-size="4.8" letter-spacing="1.2" font-family="Jost, sans-serif" fill="#69645c">{{ sub() }}</text>
      }
    }
  </svg>
}
